a">4 Jul – 26 Jul 2026</p></div></header> <aside class="nr-rail svelte-1j8hcva"><!--[--><button class="rail-card svelte-1j8hcva rail-card--active"><span class="rail-year svelte-1j8hcva">4 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 1 — Grand Départ: CRE en Barcelona</h2> <p class="svelte-1j8hcva">Una contrarreloj por equipos de 19,7 km abre la carrera, la primera con este formato desde 1971, con el tiempo individual de cada corredor registrado.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">5 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 2 — Barcelona, Circuito de Montjuïc</h2> <p class="svelte-1j8hcva">Etapa de 168,5 km y perfil ondulado con tres ascensos a Montjuïc, dando opciones a los puncheurs de vestir el maillot amarillo.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">6 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 3 — Granollers a Les Angles</h2> <p class="svelte-1j8hcva">La carrera abandona España y cruza hacia los Pirineos, con 3.850 m de desnivel y final en alto en Les Angles.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">7 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 4 — Carcassonne a Foix</h2> <p class="svelte-1j8hcva">Etapa de transición y perfil ondulado desde la ciudadela fortificada de Carcassonne hasta Foix, bajo su castillo de tres torres.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">8 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 5 — Lannemezan a Pau</h2> <p class="svelte-1j8hcva">Etapa llana de 158 km, última oportunidad de los esprínters antes de que la alta montaña pirenaica tome el control.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">9 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 6 — Pau a Gavarnie-Gèdre</h2> <p class="svelte-1j8hcva">El Col d'Aspin y el legendario Col du Tourmalet preceden a un nuevo final en alto a las puertas del Cirque de Gavarnie: el primer veredicto real de la carrera.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">10 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 7 — A través de las Landas hasta Bordeaux</h2> <p class="svelte-1j8hcva">Una etapa escénica por los bosques de las Landas termina en un esprint masivo a la sombra de la Place des Quinconces.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">11 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 8 — Bordeaux a Bergerac</h2> <p class="svelte-1j8hcva">Una segunda oportunidad consecutiva para los esprínters a través de la Dordoña, con dos esprines intermedios que alimentan la lucha por la clasificación por puntos.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">12 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 9 — Macizo Central: Le Lioran</h2> <p class="svelte-1j8hcva">La carrera regresa a Le Lioran, abriendo el bloque del Macizo Central antes del primer día de descanso.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">14 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 10 — Transición por el Macizo Central (aproximada)</h2> <p class="svelte-1j8hcva">La carrera se reanuda tras el primer día de descanso, continuando por las altiplanicies del centro de Francia. Localidades exactas pendientes de confirmar con el road-book oficial.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">15 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 11 — Hacia Borgoña (aproximada)</h2> <p class="svelte-1j8hcva">Etapa de transición hacia el noreste, camino del Jura y los Vosgos. Localidades exactas pendientes de confirmar con el road-book oficial.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">16 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 12 — Hacia el Jura (aproximada)</h2> <p class="svelte-1j8hcva">El recorrido continúa por el este de Francia antes del bloque de los Vosgos. Localidades exactas pendientes de confirmar con el road-book oficial.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">17 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 13 — Aproximación a los Vosgos (aproximada)</h2> <p class="svelte-1j8hcva">Etapa de enlace entre el centro de Francia y el macizo de los Vosgos. Localidades exactas pendientes de confirmar con el road-book oficial.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">18 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 14 — Vosgos: Le Markstein</h2> <p class="svelte-1j8hcva">Siete ascensos y 3.800 m de desnivel por los Vosgos, con final cerca de Le Markstein y aún más de una semana de carrera por delante.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">19 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 15 — Champagnole al Plateau de Solaison</h2> <p class="svelte-1j8hcva">Etapa de 184 km por el Jura que termina en una ascensión totalmente nueva: 9,1 km al 9,3%, fría y umbría, sin historia previa que estudiar.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">21 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 16 — Évian-les-Bains a Thonon-les-Bains (CRI)</h2> <p class="svelte-1j8hcva">La única contrarreloj individual de la carrera, 26 km a orillas del lago Lemán, llega justo después del segundo día de descanso.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">22 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 17 — Hacia Voiron</h2> <p class="svelte-1j8hcva">Etapa nominalmente llana con el Col des Prés y el Col de Couz: la última oportunidad de los esprínters antes de los Altos Alpes.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">23 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 18 — Orcières-Merlette</h2> <p class="svelte-1j8hcva">Final en alto en la estación ligada para siempre a la sinfonía inacabada más famosa del Tour, abriendo el bloque decisivo de montaña final.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">24 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 19 — Gap a Alpe d'Huez</h2> <p class="svelte-1j8hcva">Etapa de 128 km por el Col de Manse y el Col d'Ornon antes de las legendarias 21 curvas de Alpe d'Huez por su vertiente tradicional.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">25 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 20 — Le Bourg-d'Oisans a Alpe d'Huez</h2> <p class="svelte-1j8hcva">La etapa reina: 171 km vía el Col du Télégraphe, el Galibier y el nuevo descenso del Col de Sarenne, con final de nuevo en Alpe d'Huez por segundo día consecutivo, algo inédito en la historia del Tour.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">26 Jul 2026</span> <h2 class="svelte-1j8hcva">Etapa 21 — París: Montmartre y Campos Elíseos</h2> <p class="svelte-1j8hcva">Tres pasos por los adoquines de la Rue Lepic en Montmartre preceden al tradicional final crepuscular en los Campos Elíseos.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">4 Jul 2026</span> <h3 class="svelte-1j8hcva">Etapa 1 — Grand Départ: CRE en Barcelona</h3></div></div></div><!--]--><!--astro:end--></astro-island>     </body></html>
