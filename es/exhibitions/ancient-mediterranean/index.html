026</p></div></header> <aside class="nr-rail svelte-1j8hcva"><!--[--><button class="rail-card svelte-1j8hcva rail-card--active"><span class="rail-year svelte-1j8hcva">1500 a.C.</span> <h2 class="svelte-1j8hcva">La Talasocracia Minoica</h2> <p class="svelte-1j8hcva">Creta domina el Egeo. Sus palacios, como Cnosos, son centros de redistribución de productos que conectan Egipto con el continente griego.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">1200 a.C.</span> <h2 class="svelte-1j8hcva">Los Pueblos del Mar</h2> <p class="svelte-1j8hcva">Una crisis sistémica y ataques de confederaciones navales colapsan los imperios de la Edad del Bronce (Hititas, Micénicos), redibujando el mapa étnico.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">1000 a.C.</span> <h2 class="svelte-1j8hcva">La Expansión Fenicia</h2> <p class="svelte-1j8hcva">Desde ciudades como Tiro, los fenicios navegan hacia el extremo occidente buscando metales. Llevan consigo el alfabeto fonético y el tinte púrpura.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">814 a.C.</span> <h2 class="svelte-1j8hcva">Fundación de Cartago</h2> <p class="svelte-1j8hcva">La 'Ciudad Nueva' nace en la actual Túnez. Se convertirá en la metrópolis comercial más poderosa del Mediterráneo occidental, controlando las rutas hacia el Atlántico.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">750 a.C.</span> <h2 class="svelte-1j8hcva">La Colonización Griega</h2> <p class="svelte-1j8hcva">La falta de tierras en Grecia impulsa la creación de la Magna Grecia en Sicilia y el sur de Italia. Siracusa se convierte en una de las ciudades más ricas del mundo.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">600 a.C.</span> <h2 class="svelte-1j8hcva">Marsella (Massalia)</h2> <p class="svelte-1j8hcva">Colonos de Focea fundan Massalia. El Mediterráneo se conecta definitivamente con el interior de Europa a través del valle del Ródano, intercambiando vino por estaño.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">480 a.C.</span> <h2 class="svelte-1j8hcva">Batalla de Salamina</h2> <p class="svelte-1j8hcva">El triunfo naval de Atenas sobre los persas consagra el modelo de la trirreme y da inicio a la hegemonía cultural y política de la democracia ateniense.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">331 a.C.</span> <h2 class="svelte-1j8hcva">Alejandría de Egipto</h2> <p class="svelte-1j8hcva">Alejandro Magno funda la gran metrópolis del helenismo. Su Faro y su Biblioteca simbolizan la unión del conocimiento griego con la tradición egipcia y oriental.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">218 a.C.</span> <h2 class="svelte-1j8hcva">Aníbal y la Segunda Guerra Púnica</h2> <p class="svelte-1j8hcva">Roma y Cartago luchan por la supremacía total. El paso de los Alpes por Aníbal pone a Roma contra las cuerdas, pero acelera su transformación en potencia naval.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">146 a.C.</span> <h2 class="svelte-1j8hcva">Mare Nostrum</h2> <p class="svelte-1j8hcva">Con la destrucción de Cartago y Corinto el mismo año, Roma elimina a sus últimos rivales comerciales. El Mediterráneo se convierte, por primera vez, en un 'lago' bajo un solo mando.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">Siglo I d.C.</span> <h2 class="svelte-1j8hcva">La Ruta de la Annona</h2> <p class="svelte-1j8hcva">Se perfeccionan los grandes cargueros de grano. El puerto de Ostia en Roma recibe miles de toneladas de trigo de Egipto para alimentar a un millón de ciudadanos.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">117 d.C.</span> <h2 class="svelte-1j8hcva">Máxima Extensión del Imperio</h2> <p class="svelte-1j8hcva">Bajo Trajano, el Imperio Romano rodea completamente el Mediterráneo. Las calzadas y las rutas navales crean una red de intercambio nunca antes vista en la historia.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">1500 a.C.</span> <h3 class="svelte-1j8hcva">La Talasocracia Minoica</h3></div></div></div><!--]--><!--astro:end--></astro-island>     </body></html>
