 a Roquetes</h2> <p class="svelte-1j8hcva">La carrera entra en España para no salir más, en una etapa llana de 171,1 km propicia para los esprínters.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">27 Aug 2026</span> <h2 class="svelte-1j8hcva">Etapa 6 — Alcossebre a Castellón</h2> <p class="svelte-1j8hcva">Etapa ondulada de 176,8 km que introduce un infrecuente tramo de sterrato en el Puerto El Bartolo, a solo 16 km de meta.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">28 Aug 2026</span> <h2 class="svelte-1j8hcva">Etapa 7 — Vall d'Alba a Valdelinares</h2> <p class="svelte-1j8hcva">El recorrido se adentra en Aragón con final en alto en Valdelinares, que no recibía a La Vuelta desde 2014.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">29 Aug 2026</span> <h2 class="svelte-1j8hcva">Etapa 8 — Puçol a Xeraco</h2> <p class="svelte-1j8hcva">La última oportunidad clara para los esprínters antes de Alto de Aitana, con el puerto de segunda categoría de Barx en el tramo final.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">30 Aug 2026</span> <h2 class="svelte-1j8hcva">Etapa 9 — La Vila Joiosa a Alto de Aitana</h2> <p class="svelte-1j8hcva">Etapa brutal de 187,5 km con más de 5.000 m de desnivel en seis ascensos, cerrando la primera semana en Alto de Aitana.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">1 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 10 — Alcaraz a Elche de la Sierra</h2> <p class="svelte-1j8hcva">La carrera se reanuda tras el primer día de descanso con una etapa ondulada por la provincia de Albacete, una oportunidad para la fuga.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">2 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 11 — Cartagena a Lorca</h2> <p class="svelte-1j8hcva">Etapa llana de 156,1 km con un único puerto a 33,5 km de meta, la principal opción del día para los esprínters.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">3 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 12 — Vera a Calar Alto</h2> <p class="svelte-1j8hcva">El Alto de Velefique precede al final en alto en el observatorio de Calar Alto, en una Almería abrasada por el sol.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">4 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 13 — Almuñécar a Loja</h2> <p class="svelte-1j8hcva">Etapa de transición y perfil ondulado de 193,2 km en dirección a Jaén, antesala de la Sierra de la Pandera.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">5 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 14 — Jaén a Sierra de la Pandera</h2> <p class="svelte-1j8hcva">Final en alto aún fresco en la memoria tras la victoria de Richard Carapaz en 2022, una cita clave para la general en Andalucía.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">6 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 15 — Palma del Río a Córdoba</h2> <p class="svelte-1j8hcva">Etapa ondulada de 181,2 km que cierra la segunda semana con final en la histórica ciudad de Córdoba.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">8 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 16 — Cortegana a La Rábida</h2> <p class="svelte-1j8hcva">La carrera se reanuda tras el segundo día de descanso con una etapa llana de 186 km, con final cerca del monasterio desde el que partió Colón.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">9 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 17 — Dos Hermanas a Sevilla</h2> <p class="svelte-1j8hcva">Etapa llana de 189,2 km que supone el decimosexto final de etapa de La Vuelta en las calles de Sevilla.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">10 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 18 — El Puerto de Santa María a Jerez de la Frontera (CRI)</h2> <p class="svelte-1j8hcva">Contrarreloj individual y llana de 32,5 km por la costa de Cádiz, más larga que cualquier contrarreloj del Tour de Francia 2026.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">11 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 19 — Vélez-Málaga a Peñas Blancas</h2> <p class="svelte-1j8hcva">Etapa de 205,1 km por las sierras de Ronda, con tres puertos antes de un final en alto en Peñas Blancas, sobre el Mediterráneo.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">12 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 20 — La Calahorra al Collado del Alguacil</h2> <p class="svelte-1j8hcva">La etapa reina: más de 5.000 m de desnivel con doble ascenso al Alto de Hazallanas y un brutal final inédito en el Collado del Alguacil, con rampas de hasta el 20%.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">13 Sep 2026</span> <h2 class="svelte-1j8hcva">Etapa 21 — Granada: Final en la Alhambra</h2> <p class="svelte-1j8hcva">Granada acoge el primer final de La Vuelta fuera de Madrid o Santiago, con cinco ascensos a la Alhambra que aún podrían decidir la clasificación general.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">22 Aug 2026</span> <h3 class="svelte-1j8hcva">Etapa 1 — Mónaco (CRI)</h3></div></div></div><!--]--><!--astro:end--></astro-island></body></html>
