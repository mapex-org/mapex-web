a">814 a.C.</span> <h2 class="svelte-1j8hcva">Foundation of Carthage</h2> <p class="svelte-1j8hcva">The 'New City' is founded in present-day Tunisia. It will become the most powerful commercial metropolis in the western Mediterranean, controlling routes to the Atlantic.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">750 a.C.</span> <h2 class="svelte-1j8hcva">Greek Colonization</h2> <p class="svelte-1j8hcva">Land scarcity in Greece drives the creation of Magna Graecia in Sicily and southern Italy. Syracuse becomes one of the richest cities in the ancient world.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">600 a.C.</span> <h2 class="svelte-1j8hcva">Marseille (Massalia)</h2> <p class="svelte-1j8hcva">Phocaean colonists found Massalia. The Mediterranean becomes firmly connected to inland Europe through the Rhone valley, exchanging wine for tin.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">480 a.C.</span> <h2 class="svelte-1j8hcva">Battle of Salamis</h2> <p class="svelte-1j8hcva">Athens' naval victory over Persia confirms the trireme model and ushers in the cultural and political hegemony of Athenian democracy.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">331 a.C.</span> <h2 class="svelte-1j8hcva">Alexandria of Egypt</h2> <p class="svelte-1j8hcva">Alexander the Great founds the great metropolis of Hellenism. Its Lighthouse and Library symbolize the fusion of Greek knowledge with Egyptian and Eastern traditions.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">218 a.C.</span> <h2 class="svelte-1j8hcva">Hannibal and the Second Punic War</h2> <p class="svelte-1j8hcva">Rome and Carthage fight for total supremacy. Hannibal's Alpine crossing pushes Rome to the brink, while accelerating its transformation into a naval power.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">146 a.C.</span> <h2 class="svelte-1j8hcva">Mare Nostrum</h2> <p class="svelte-1j8hcva">With Carthage and Corinth destroyed in the same year, Rome eliminates its final commercial rivals. For the first time, the Mediterranean becomes a 'lake' under a single command.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">Siglo I d.C.</span> <h2 class="svelte-1j8hcva">The Annona Route</h2> <p class="svelte-1j8hcva">Large grain carriers are perfected. Rome's port of Ostia receives thousands of tons of Egyptian wheat to feed a population of around one million citizens.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">117 d.C.</span> <h2 class="svelte-1j8hcva">Maximum Extent of the Empire</h2> <p class="svelte-1j8hcva">Under Trajan, the Roman Empire fully encircles the Mediterranean. Roads and sea lanes create an unprecedented network of exchange.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">1500 a.C.</span> <h3 class="svelte-1j8hcva">The Minoan Thalassocracy</h3></div></div></div><!--]--><!--astro:end--></astro-island>     </body></html>
