</span> <h2 class="svelte-1j8hcva">Stage 6 — Alcossebre to Castellón</h2> <p class="svelte-1j8hcva">A hilly 176.8 km stage introducing a rare sterrato section at Puerto El Bartolo, just 16 km from the finish.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">28 Aug 2026</span> <h2 class="svelte-1j8hcva">Stage 7 — Vall d'Alba to Valdelinares</h2> <p class="svelte-1j8hcva">The route heads into Aragón for a summit finish at Valdelinares, which hasn't hosted La Vuelta since 2014.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">29 Aug 2026</span> <h2 class="svelte-1j8hcva">Stage 8 — Puçol to Xeraco</h2> <p class="svelte-1j8hcva">The last clear chance for the sprinters before Alto de Aitana, with the category-two Barx climb in the finale.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">30 Aug 2026</span> <h2 class="svelte-1j8hcva">Stage 9 — La Vila Joiosa to Alto de Aitana</h2> <p class="svelte-1j8hcva">A brutal 187.5 km stage with over 5,000 m of climbing across six ascents, closing the opening week at Alto de Aitana.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">1 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 10 — Alcaraz to Elche de la Sierra</h2> <p class="svelte-1j8hcva">The race resumes after the first rest day with a rolling stage through the province of Albacete, a chance for the breakaway.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">2 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 11 — Cartagena to Lorca</h2> <p class="svelte-1j8hcva">A flat 156.1 km stage with a single climb 33.5 km from the line, the sprinters' main chance of the day.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">3 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 12 — Vera to Calar Alto</h2> <p class="svelte-1j8hcva">The Alto de Velefique precedes a summit finish at the sun-parched Calar Alto observatory in Almería.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">4 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 13 — Almuñécar to Loja</h2> <p class="svelte-1j8hcva">A hilly 193.2 km transition stage heading toward Jaén ahead of the Sierra de la Pandera.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">5 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 14 — Jaén to Sierra de la Pandera</h2> <p class="svelte-1j8hcva">A summit finish fresh in memory since Richard Carapaz's 2022 win, a key GC rendezvous in Andalusia.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">6 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 15 — Palma del Río to Córdoba</h2> <p class="svelte-1j8hcva">A hilly 181.2 km stage closing the second week with a finish in the historic city of Córdoba.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">8 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 16 — Cortegana to La Rábida</h2> <p class="svelte-1j8hcva">The race resumes after the second rest day with a flat 186 km stage finishing near the monastery from which Columbus set sail.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">9 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 17 — Dos Hermanas to Sevilla</h2> <p class="svelte-1j8hcva">A flat 189.2 km stage delivering the sixteenth Vuelta stage finish in the streets of Sevilla.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">10 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 18 — El Puerto de Santa María to Jerez de la Frontera (ITT)</h2> <p class="svelte-1j8hcva">A flat 32.5 km individual time trial along the Cádiz coast, longer than any time trial in the 2026 Tour de France.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">11 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 19 — Vélez-Málaga to Peñas Blancas</h2> <p class="svelte-1j8hcva">A 205.1 km stage through the sierras of Ronda, with three categorised climbs before a summit finish at Peñas Blancas above the Mediterranean.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">12 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 20 — La Calahorra to Collado del Alguacil</h2> <p class="svelte-1j8hcva">The queen stage: over 5,000 m of climbing with a double ascent of Alto de Hazallanas and a brutal new finish at the Collado del Alguacil, with gradients up to 20%.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">13 Sep 2026</span> <h2 class="svelte-1j8hcva">Stage 21 — Granada: the Alhambra Finale</h2> <p class="svelte-1j8hcva">Granada hosts the first-ever Vuelta finale away from Madrid or Santiago, with five ascents to the Alhambra that could still decide the general classification.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">22 Aug 2026</span> <h3 class="svelte-1j8hcva">Stage 1 — Monaco (ITT)</h3></div></div></div><!--]--><!--astro:end--></astro-island></body></html>
