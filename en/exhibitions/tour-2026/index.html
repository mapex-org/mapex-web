ximate)</h2> <p class="svelte-1j8hcva">A stage bridging central France and the Vosges massif. Exact stage towns pending confirmation from the official road-book.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">18 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 14 — Vosges: Le Markstein</h2> <p class="svelte-1j8hcva">Seven ascents and 3,800 m of climbing through the Vosges, finishing near Le Markstein with more than a week of racing still to come.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">19 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 15 — Champagnole to Plateau de Solaison</h2> <p class="svelte-1j8hcva">A 184 km stage through the Jura ends on a brand-new climb: 9.1 km at 9.3%, cold and shadowed, with no history to study.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">21 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 16 — Évian-les-Bains to Thonon-les-Bains (ITT)</h2> <p class="svelte-1j8hcva">The race's only individual time trial, 26 km along the shore of Lake Geneva, arrives right after the second rest day.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">22 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 17 — Towards Voiron</h2> <p class="svelte-1j8hcva">A notionally flat stage with the Col des Prés and Col de Couz — the last dance for the sprinters before the high Alps.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">23 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 18 — Orcières-Merlette</h2> <p class="svelte-1j8hcva">A summit finish at the resort forever linked to the Tour's most famous unfinished symphony, opening the decisive final mountain block.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">24 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 19 — Gap to Alpe d'Huez</h2> <p class="svelte-1j8hcva">A 128 km stage over the Col de Manse and Col d'Ornon before the legendary 21 hairpins of Alpe d'Huez from its traditional side.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">25 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 20 — Le Bourg-d'Oisans to Alpe d'Huez</h2> <p class="svelte-1j8hcva">The queen stage: 171 km via the Col du Télégraphe, the Galibier, and the new Col de Sarenne descent, finishing atop Alpe d'Huez for the second consecutive day — a first in Tour history.</p></button><button class="rail-card svelte-1j8hcva"><span class="rail-year svelte-1j8hcva">26 Jul 2026</span> <h2 class="svelte-1j8hcva">Stage 21 — Paris: Montmartre &amp; Champs-Élysées</h2> <p class="svelte-1j8hcva">Three passages through the cobbles of Rue Lepic in Montmartre precede the traditional twilight finish on the Champs-Élysées.</p></button><!--]--></aside> <div class="nr-focus-card svelte-1j8hcva"><span class="focus-index svelte-1j8hcva">1</span> <div><span class="focus-year svelte-1j8hcva">4 Jul 2026</span> <h3 class="svelte-1j8hcva">Stage 1 — Grand Départ: Barcelona TTT</h3></div></div></div><!--]--><!--astro:end--></astro-island>     </body></html>
